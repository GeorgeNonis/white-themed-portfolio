name: CI

on:
  push:
    branches: [master, feat/**]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Assert Vercel Nitro preset
        run: |
          node -e "const j=require('./.vercel/output/nitro.json'); if(j.preset!=='vercel'){console.error(j); process.exit(1)} console.log('preset ok', j.preset)"
